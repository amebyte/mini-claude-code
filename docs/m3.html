<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实现Claude Code 的流式输出</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img id="img" src="images/m3/1.png" alt="图片">
    <script>
        const images = ['images/m3/1.png'];
        let index = 0;

        document.getElementById('img').addEventListener('click', function () {
            index = (index + 1) % images.length;
            this.src = images[index];
        });
    </script>
</body>
</html>
